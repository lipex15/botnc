[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nightcrows-visual-automator"
version = "0.1.0"
description = "Automação visual configurável para Night Crows em 1920x1080"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "mss>=10.0",
  "numpy>=2.0",
  "opencv-python>=4.10",
  "PyAutoGUI>=0.9.54",
  "PySide6>=6.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]

[project.scripts]
nightcrows-bot = "nightcrows_bot.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

